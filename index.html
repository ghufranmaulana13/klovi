<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <meta name="virtual-protocol-site-verification" content="b761467bc610e396bcdbe1db6386ffbb" />
  <title>klovi</title>
  <meta name="description" content="An AI-powered neobank built on Robinhood Chain. Launching soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:      #050505;
      --text-1:  #f0f0f0;
      --text-2:  #666666;
      --lime:    #c6f135;
      --ink:     #0a0a0a;
      --glow:    rgba(198, 241, 53, 0.18);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layout */
    main {
      display: flex;
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Radial ambient glow */
    main::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 55% 45% at 50% 50%, var(--glow) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    /* Noise texture overlay */
    main::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      z-index: 1;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo-wrap svg {
      width: min(309px, 72vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 0 36px rgba(198, 241, 53, 0.22));
    }

    /* Tagline */
    .tagline {
      position: relative;
      z-index: 1;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text-1);
      text-wrap: balance;
      animation: fadeUp 0.9s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Pill Badge */
    .badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 9999px;
      background-color: var(--lime);
      padding: 0.5rem 1.125rem;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink);
      box-shadow:
        0 0 0 1px rgba(198, 241, 53, 0.35),
        0 0 24px rgba(198, 241, 53, 0.28),
        0 0 56px rgba(198, 241, 53, 0.1);
      animation: fadeUp 0.9s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
      cursor: default;
      user-select: none;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .badge:hover {
      transform: scale(1.04);
      box-shadow:
        0 0 0 1px rgba(198, 241, 53, 0.55),
        0 0 32px rgba(198, 241, 53, 0.42),
        0 0 72px rgba(198, 241, 53, 0.18);
    }

    /* Pulsing dot inside badge */
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.55;
      flex-shrink: 0;
      animation: dotPulse 2s ease-in-out infinite;
    }

    /* Sub-text */
    .sub-text {
      position: relative;
      z-index: 1;
      font-size: 0.875rem;
      color: var(--text-2);
      letter-spacing: 0.01em;
      animation: fadeUp 0.9s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.5; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.55; transform: scale(1);   }
      50%       { opacity: 0.9;  transform: scale(1.5); }
    }
  </style>
</head>
<body>
  <main>

    <!-- Logo: inline SVG wordmark -->
    <div class="logo-wrap" aria-label="klovi logo">
      <svg viewBox="0 0 340 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="klovi">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="340" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#bbbbbb"/>
          </linearGradient>
        </defs>

        <!-- k -->
        <line x1="16"  y1="26" x2="16"  y2="94" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
        <line x1="16"  y1="60" x2="50"  y2="26" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
        <line x1="29"  y1="47" x2="52"  y2="94" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>

        <!-- l -->
        <line x1="72"  y1="26" x2="72"  y2="94" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>

        <!-- o -->
        <ellipse cx="116" cy="67" rx="22" ry="27" stroke="url(#lg)" stroke-width="10" fill="none"/>

        <!-- v -->
        <line x1="150" y1="40" x2="170" y2="94" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
        <line x1="190" y1="40" x2="170" y2="94" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>

        <!-- i dot -->
        <circle cx="218" cy="33" r="6" fill="url(#lg)"/>
        <!-- i stem -->
        <line x1="218" y1="48" x2="218" y2="94" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Tagline -->
    <p class="tagline">make your own luck.</p>

    <!-- Pill badge -->
    <span class="badge" id="launch-badge">
      <span class="dot" aria-hidden="true"></span>
      Launching soon
    </span>

    <!-- Sub-text -->
    <p class="sub-text">Built on Robinhood Chain.</p>

  </main>
</body>
</html>
